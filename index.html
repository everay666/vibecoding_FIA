<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>遗迹回声 / Echoes of the Buried Relic</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 渲染画布挂载点：Three.js 的 canvas 会由 scene.js 注入这里 -->
  <div id="game-container"></div>

  <!-- 开始菜单 -->
  <div id="menu-screen" class="screen">
    <h1>遗迹回声</h1>
    <p class="subtitle">Echoes of the Buried Relic</p>
    <button id="start-button">开始游戏</button>
    <button id="demo-button">观看演示 / Demo</button>
    <div class="volume-row">
      <label for="volume-slider">音量</label>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" />
      <button id="mute-button">🔊</button>
    </div>
    <p class="hint">目标：收集 3 个被掩埋的宝物，打开出口并抵达终点</p>
  </div>

  <!-- 暂停菜单 -->
  <div id="pause-screen" class="screen" style="display:none">
    <h2>已暂停</h2>
    <button id="resume-button">继续</button>
    <button id="restart-button" data-action="restart">重新开始</button>
    <button id="menu-button" data-action="menu">返回菜单</button>
  </div>

  <!-- 结果（胜利 / 失败） -->
  <div id="result-screen" class="screen" style="display:none">
    <h2 id="result-message">完成</h2>
    <button data-action="restart">重新开始</button>
    <button data-action="menu">返回菜单</button>
  </div>

  <!-- HUD（进行中界面信息） -->
  <div id="hud" style="display:none">
    <span id="objective">目标</span>
    <span id="progress">0 / 3</span>
    <span id="health">3 / 3</span>
    <span id="interaction-prompt"></span>
    <span id="demo-badge" style="display:none">Demo</span>
    <button id="pause-button">暂停</button>
  </div>

  <!-- import map：让浏览器从 jsDelivr CDN 加载 Three.js ES Module（需要联网） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
